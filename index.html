<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Student Result Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #263238;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin-top: 8px;
            color: #cfd8dc;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #263238;
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            border: none;
            padding: 11px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        .add-btn {
            width: 100%;
            background: #263238;
            color: white;
        }

        .delete-btn {
            background: #c62828;
            color: white;
        }

        .search {
            margin-bottom: 15px;
        }

        .table-box {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #eceff1;
        }

        .no-data {
            text-align: center;
            color: #777;
            padding: 25px;
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            background: #eceff1;
            border-radius: 8px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 23px;
            }

            .card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Smart Student Result Analyzer</h1>
        <p>BCA Mini Project | HTML, CSS & JavaScript</p>
    </header>


    <div class="container">

        <!-- Add Student -->
        <div class="card">

            <h2>➕ Add Student Result</h2>

            <input
                type="text"
                id="rollNo"
                placeholder="Enter Roll Number"
            >

            <input
                type="text"
                id="studentName"
                placeholder="Enter Student Name"
            >

            <input
                type="number"
                id="maths"
                placeholder="Mathematics Marks (0-100)"
                min="0"
                max="100"
            >

            <input
                type="number"
                id="science"
                placeholder="Science Marks (0-100)"
                min="0"
                max="100"
            >

            <input
                type="number"
                id="computer"
                placeholder="Computer Science Marks (0-100)"
                min="0"
                max="100"
            >

            <input
                type="number"
                id="english"
                placeholder="English Marks (0-100)"
                min="0"
                max="100"
            >

            <input
                type="number"
                id="hindi"
                placeholder="Hindi Marks (0-100)"
                min="0"
                max="100"
            >

            <button
                class="add-btn"
                onclick="addStudent()"
            >
                Add Student
            </button>

        </div>


        <!-- Search Student -->
        <div class="card">

            <h2>🔍 Search Student</h2>

            <input
                class="search"
                type="text"
                id="search"
                placeholder="Search by name or roll number"
                oninput="displayStudents()"
            >

            <div class="table-box">

                <table>

                    <thead>

                        <tr>
                            <th>Roll No.</th>
                            <th>Name</th>
                            <th>Total</th>
                            <th>Percentage</th>
                            <th>Grade</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="studentTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        let students =
            JSON.parse(localStorage.getItem("resultStudents")) || [];


        function saveData() {

            localStorage.setItem(
                "resultStudents",
                JSON.stringify(students)
            );

        }


        function addStudent() {

            const roll =
                document.getElementById("rollNo").value.trim();

            const name =
                document.getElementById("studentName").value.trim();

            const maths =
                Number(document.getElementById("maths").value);

            const science =
                Number(document.getElementById("science").value);

            const computer =
                Number(document.getElementById("computer").value);

            const english =
                Number(document.getElementById("english").value);

            const hindi =
                Number(document.getElementById("hindi").value);


            if (
                roll === "" ||
                name === ""
            ) {

                alert("Please enter Roll Number and Student Name.");

                return;
            }


            if (
                maths < 0 || maths > 100 ||
                science < 0 || science > 100 ||
                computer < 0 || computer > 100 ||
                english < 0 || english > 100 ||
                hindi < 0 || hindi > 100
            ) {

                alert("Please enter marks between 0 and 100.");

                return;
            }


            const exists =
                students.some(
                    student => student.roll === roll
                );


            if (exists) {

                alert("This Roll Number already exists.");

                return;
            }


            const total =
                maths +
                science +
                computer +
                english +
                hindi;


            const percentage =
                (total / 500) * 100;


            let grade;


            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }


            students.push({

                roll: roll,

                name: name,

                total: total,

                percentage: percentage.toFixed(2),

                grade: grade

            });


            saveData();


            document.getElementById("rollNo").value = "";

            document.getElementById("studentName").value = "";

            document.getElementById("maths").value = "";

            document.getElementById("science").value = "";

            document.getElementById("computer").value = "";

            document.getElementById("english").value = "";

            document.getElementById("hindi").value = "";


            displayStudents();

        }


        function deleteStudent(index) {

            if (
                confirm(
                    "Are you sure you want to delete this student?"
                )
            ) {

                students.splice(index, 1);

                saveData();

                displayStudents();

            }

        }


        function displayStudents() {

            const table =
                document.getElementById("studentTable");

            const search =
                document.getElementById("search")
                .value
                .toLowerCase();


            table.innerHTML = "";


            const filteredStudents =
                students.filter(student =>

                    student.roll
                        .toLowerCase()
                        .includes(search)

                    ||

                    student.name
                        .toLowerCase()
                        .includes(search)

                );


            if (filteredStudents.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="6" class="no-data">
                            No students found
                        </td>
                    </tr>
                `;

                return;
            }


            filteredStudents.forEach(student => {

                const index =
                    students.indexOf(student);


                table.innerHTML += `

                    <tr>

                        <td>
                            ${student.roll}
                        </td>

                        <td>
                            ${student.name}
                        </td>

                        <td>
                            ${student.total}/500
                        </td>

                        <td>
                            ${student.percentage}%
                        </td>

                        <td>
                            <strong>
                                ${student.grade}
                            </strong>
                        </td>

                        <td>

                            <button
                                class="delete-btn"
                                onclick="deleteStudent(${index})"
                            >
                                Delete
                            </button>

                        </td>

                    </tr>

                `;

            });

        }


        displayStudents();

    </script>

</body>

</html>
